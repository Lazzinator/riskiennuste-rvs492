# Julkaisu GitHub Pagesiin. Ajetaan, kun main-haaraan tulee muutoksia, tai käsin Actions-välilehdeltä.
# Sivu julkaistaan vain, jos tyyppitarkistus, testit ja build menevät läpi.
name: Julkaisu GitHub Pagesiin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Vain yksi julkaisu kerrallaan; keskeneräistä julkaisua ei peruta.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tyyppitarkistus
        run: npm run typecheck
      - name: Testit
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
