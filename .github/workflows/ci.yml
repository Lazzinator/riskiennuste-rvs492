# Tarkistus pull requesteille: sama säähaku ja mallin opetus kuin julkaisussa, tyyppitarkistus,
# testit ja build. Ei julkaise mitään.
name: Tarkistus

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tyyppitarkistus
        run: npm run typecheck
      - name: Testit (repositorion data)
        run: npm test
      - name: Säätiedot (Ilmatieteen laitos)
        id: weather
        continue-on-error: true
        run: npm run fetch-weather
      - name: Mallin opetus
        run: npm run build-model
      - name: Testit (haetulla säällä)
        run: npm test
      - name: Build
        run: npm run build
      - name: Yhteenveto
        if: always()
        run: |
          echo "Säähaku: ${{ steps.weather.outcome }}" >> "$GITHUB_STEP_SUMMARY"
